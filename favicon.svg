<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <g transform="translate(32,32)" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center gear wheel -->
    <circle cx="0" cy="0" r="10" stroke="#f59e0b" stroke-width="3" fill="#1e293b"/>
    <circle cx="0" cy="0" r="4" fill="#f59e0b"/>
    <!-- Gear cogs -->
    <path d="M -3 -19 L 3 -19 L 4 -14 L -4 -14 Z" fill="#f59e0b"/>
    <path d="M -3 19 L 3 19 L 4 14 L -4 14 Z" fill="#f59e0b"/>
    <path d="M -19 -3 L -19 3 L -14 4 L -14 -4 Z" fill="#f59e0b"/>
    <path d="M 19 -3 L 19 3 L 14 4 L 14 -4 Z" fill="#f59e0b"/>
    <!-- Diagonal cogs -->
    <g transform="rotate(45)">
      <path d="M -3 -19 L 3 -19 L 4 -14 L -4 -14 Z" fill="#f59e0b"/>
      <path d="M -3 19 L 3 19 L 4 14 L -4 14 Z" fill="#f59e0b"/>
      <path d="M -19 -3 L -19 3 L -14 4 L -14 -4 Z" fill="#f59e0b"/>
      <path d="M 19 -3 L 19 3 L 14 4 L 14 -4 Z" fill="#f59e0b"/>
    </g>
  </g>
</svg>
